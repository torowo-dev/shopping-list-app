<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쇼핑 리스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    margin: 0;
    padding: 40px 20px;
    color: #333;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  header {
    padding: 28px 24px 20px;
    background: #fff;
    border-bottom: 1px solid #eee;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
  }
  .subtitle {
    color: #888;
    font-size: 14px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
  }
  #itemInput {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  #itemInput:focus { border-color: #667eea; }
  #addBtn {
    padding: 12px 20px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  #addBtn:hover { background: #5a6fd6; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 60vh;
    overflow-y: auto;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.1s;
  }
  li:hover { background: #fafafa; }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #667eea;
  }
  li .text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  li.done .text {
    text-decoration: line-through;
    color: #aaa;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #c33;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    opacity: 0.6;
    transition: opacity 0.15s, background 0.15s;
  }
  .delete-btn:hover {
    opacity: 1;
    background: #fee;
  }
  .empty {
    padding: 40px 24px;
    text-align: center;
    color: #aaa;
    font-size: 14px;
  }
  footer {
    padding: 12px 24px;
    background: #fafafa;
    border-top: 1px solid #eee;
    font-size: 13px;
    color: #888;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .clear-btn {
    background: transparent;
    border: none;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
  .clear-btn:hover { color: #c33; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <div class="subtitle">사야 할 것을 추가해 보세요</div>
    </header>
    <div class="input-row">
      <input id="itemInput" type="text" placeholder="예: 우유, 계란, 빵..." maxlength="100">
      <button id="addBtn">추가</button>
    </div>
    <ul id="list"></ul>
    <footer>
      <span id="counter">0개</span>
      <button class="clear-btn" id="clearDone">완료된 항목 삭제</button>
    </footer>
  </div>

<script>
  const STORAGE_KEY = "shopping-list-items";
  const listEl = document.getElementById("list");
  const inputEl = document.getElementById("itemInput");
  const addBtn = document.getElementById("addBtn");
  const counterEl = document.getElementById("counter");
  const clearDoneBtn = document.getElementById("clearDone");

  let items = load();

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function render() {
    listEl.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "아직 항목이 없습니다.";
      listEl.appendChild(empty);
    } else {
      items.forEach((item) => {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.done;
        checkbox.addEventListener("change", () => toggleItem(item.id));

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = item.text;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "✕";
        delBtn.title = "삭제";
        delBtn.addEventListener("click", () => deleteItem(item.id));

        li.append(checkbox, text, delBtn);
        listEl.appendChild(li);
      });
    }

    const remaining = items.filter((i) => !i.done).length;
    counterEl.textContent = `${items.length}개 (남은 항목 ${remaining}개)`;
  }

  function addItem() {
    const text = inputEl.value.trim();
    if (!text) return;
    items.push({ id: Date.now() + Math.random(), text, done: false });
    inputEl.value = "";
    save();
    render();
    inputEl.focus();
  }

  function toggleItem(id) {
    const item = items.find((i) => i.id === id);
    if (item) {
      item.done = !item.done;
      save();
      render();
    }
  }

  function deleteItem(id) {
    items = items.filter((i) => i.id !== id);
    save();
    render();
  }

  function clearDone() {
    if (!items.some((i) => i.done)) return;
    if (!confirm("완료된 항목을 모두 삭제할까요?")) return;
    items = items.filter((i) => !i.done);
    save();
    render();
  }

  addBtn.addEventListener("click", addItem);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addItem();
  });
  clearDoneBtn.addEventListener("click", clearDone);

  render();
  inputEl.focus();
</script>
</body>
</html>
